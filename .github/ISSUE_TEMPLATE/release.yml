name: 📦 Release
description: Prepare a new version release
title: "[SPLTRP-XXXX]: Release - vX.Y.Z"
labels: [ "release" ]
assignees: [ "pedrazamiguez" ]
body:
  - type: markdown
    attributes:
      value: |
        ### Release Preparation
        This issue triggers the automated release flow. A branch `release/SPLTRP-XXXX` will be created and a PR to `main` will be opened automatically.

  - type: checkboxes
    id: release_type
    attributes:
      label: Release Type
      description: Is this a breaking change?
      options:
        - label: Major Release (Breaking Changes)
          required: false

  - type: textarea
    id: notes
    attributes:
      label: Release Notes / Context
      description: Optional curated Google Play Store release notes (max 500 chars per locale). Leave blank to auto-generate from user-facing PRs (`feature`, `bug`, `enhancement`, `hotfix`) with localized Spanish summaries.
      placeholder: |
        #### en-US
        - Highlighted user-facing changes in English.

        #### es-ES
        - Cambios destacados para los usuarios en español.
