name: Coverage and Architecture

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  konsist:
    name: Konsist (Architecture Rules)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"es.pedrazamiguez.splittrip"}},"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Konsist Architecture Tests
        run: ./gradlew :konsist-tests:test

      - name: Publish Konsist Architecture Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Konsist Architecture Tests
          path: konsist-tests/build/test-results/test/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Konsist test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: konsist-test-results
          path: |
            konsist-tests/build/reports/tests/test/**

  jacoco:
    name: JaCoCo (Code Coverage)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"es.pedrazamiguez.splittrip"}},"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests and generate JaCoCo merged report
        run: ./gradlew testDebugUnitTest :domain:test jacocoMergedReport


      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-reports
          path: |
            build/reports/jacoco/merged/**

  sonar:
    name: SonarQube Analysis
    # SonarQube CE 9.9 does not support PR decoration (inline comments on diffs) — that
    # requires Developer Edition+. However, the scanner CAN still run on PR code and the
    # Quality Gate result will pass/fail the CI check, which is what gates the merge.
    # Trade-off: CE has a single project baseline, so concurrent PR analyses may
    # temporarily overwrite each other's dashboard state. The next push to develop/main
    # always restores the authoritative baseline.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: [jacoco]
    permissions:
      contents: read
      actions: read
      pull-requests: write   # required to post the QG-failed comment
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history required by SonarQube for blame information and accurate
          # new-code detection (identifying issues introduced in a given PR/push).
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"es.pedrazamiguez.splittrip"}},"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Download JaCoCo merged report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-reports
          # upload-artifact strips the directory prefix (least common ancestor),
          # so the artifact contains files relative to build/reports/jacoco/merged/.
          # We must restore them into the expected directory for the Sonar scanner.
          path: build/reports/jacoco/merged

      - name: Verify JaCoCo report was restored
        run: |
          echo "── JaCoCo merged report ──"
          ls -la build/reports/jacoco/merged/ || echo "⚠ Directory not found"
          if [ ! -f build/reports/jacoco/merged/jacocoMergedReport.xml ]; then
            echo "❌ jacocoMergedReport.xml not found — coverage will be 0%!"
            exit 1
          fi
          echo "✅ jacocoMergedReport.xml found"
          # Quick sanity check: report should contain at least one <counter> with covered > 0
          if grep -q 'covered="[1-9]' build/reports/jacoco/merged/jacocoMergedReport.xml; then
            echo "✅ Report contains non-zero coverage data"
          else
            echo "⚠ Report has no non-zero coverage counters — check class paths"
          fi

      - name: Compile Kotlin classes for Sonar bytecode analysis
        run: ./gradlew compileDebugKotlin :domain:compileKotlin --no-configuration-cache

      - name: Run SonarQube analysis
        id: sonar
        # continue-on-error so the PR comment step below can run even when the gate fails.
        # The job is explicitly re-failed afterwards via the "Fail if gate failed" step.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # --no-configuration-cache: SonarScanner is incompatible with Gradle config cache.
        # -Dsonar.qualitygate.wait=true: scanner polls SonarQube after analysis until the
        # Quality Gate result is ready, then exits non-zero if the gate fails.
        # -Dsonar.qualitygate.timeout=300: wait up to 5 minutes for QG computation.
        run: >-
          ./gradlew sonar
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          --no-configuration-cache

      - name: Comment on PR if Quality Gate failed
        if: github.event_name == 'pull_request' && steps.sonar.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const sonarUrl = `${{ secrets.SONAR_HOST_URL }}/dashboard?id=split-trip`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ SonarQube Quality Gate Failed',
                '',
                'The analysis completed but one or more quality gate conditions were not met.',
                '',
                `🔍 [View details on the SonarQube dashboard](${sonarUrl})`,
                '',
                '_Fix the reported issues and push again to re-trigger analysis._'
              ].join('\n')
            });

      - name: Fail job if Quality Gate failed
        if: steps.sonar.outcome == 'failure'
        run: |
          echo "❌ SonarQube Quality Gate failed — see dashboard for details."
          exit 1

