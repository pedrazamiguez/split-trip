name: Deploy Firebase

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase/remoteconfig.template.json'
  workflow_dispatch:
    inputs:
      force_overwrite_values:
        description: 'Overwrite live Firebase Remote Config values from git template (disables additive merge)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint_test_deploy:
    name: Lint, Test & Deploy Functions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Lint
        working-directory: functions
        run: npm run lint

      - name: Run tests
        working-directory: functions
        run: npm test

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Functions, Firestore, and Storage to Firebase
        run: npx firebase-tools deploy --only functions,firestore,storage --force

      - name: Deploy Remote Config to Firebase
        run: |
          if [ "${{ inputs.force_overwrite_values }}" = "true" ]; then
            ./scripts/deploy-remote-config.sh deploy --overwrite
          else
            ./scripts/deploy-remote-config.sh deploy
          fi

