name: Deploy to Google Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal    # Prueba interna (instant rollout to internal testers)
          - alpha       # Prueba cerrada (Closed testing)
          - beta        # Prueba abierta (Open testing)
          - production  # Producción (Live public store listing)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy_play_store:
    name: Build & Deploy Release Bundle to Google Play
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      OER_APP_ID_RELEASE: ${{ secrets.OER_APP_ID_RELEASE }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract Version Info
        id: version_extractor
        run: |
          VERSION_MAJOR=$(grep "^versionMajor=" version.properties | cut -d'=' -f2)
          VERSION_MINOR=$(grep "^versionMinor=" version.properties | cut -d'=' -f2)
          VERSION_PATCH=$(grep "^versionPatch=" version.properties | cut -d'=' -f2)
          VERSION_SNAPSHOT=$(grep "^versionSnapshot=" version.properties | cut -d'=' -f2)

          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          if [ "$VERSION_SNAPSHOT" = "true" ]; then
            VERSION_NAME="${VERSION_NAME}-SNAPSHOT"
          fi

          VERSION_CODE=$((VERSION_MAJOR * 1000000 + VERSION_MINOR * 1000 + VERSION_PATCH))

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "App Version Name: $VERSION_NAME"
          echo "App Version Code: $VERSION_CODE"

      - name: Resolve Target Track
        id: track_resolver
        run: |
          # Use manual input if dispatched, or default to 'internal' for pushes to main
          TRACK="${{ github.event.inputs.track || 'internal' }}"
          echo "TRACK=${TRACK}" >> $GITHUB_OUTPUT
          echo "Selected Google Play Track: $TRACK"

      - name: Generate Localized Release Notes (whatsnew)
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p distribution/whatsnew

          CURRENT_VERSION="${{ steps.version_extractor.outputs.VERSION_NAME }}"
          LATEST_TAG=$(git tag -l "v*" | grep -v "v${CURRENT_VERSION}" | sort -V | tail -n 1)

          if [ -n "$LATEST_TAG" ]; then
            SEARCH_FILTER="merged:>$(git show -s --format=%cI $(git rev-list -n 1 $LATEST_TAG))"
          else
            SEARCH_FILTER=""
          fi

          # Query merged PRs between tags
          SEARCH_QUERY="is:pr is:merged base:develop $SEARCH_FILTER"
          PRS_JSON=$(gh pr list --search "$SEARCH_QUERY" --json number,title,labels --limit 20 2>/dev/null || echo "[]")

          # Extract concise summary lines (strip issue codes like [SPLTRP-xxxx])
          BULLETS=$(echo "$PRS_JSON" | jq -r '.[] | "- " + (.title | sub("\\[(SPLTRP|EXSHAPP)-[0-9]{4}\\]:?\\s*"; ""))' | head -n 5)

          if [ -z "$BULLETS" ]; then
            BULLETS="- Performance improvements and bug fixes."
            BULLETS_ES="- Mejoras de rendimiento y corrección de errores."
          else
            BULLETS_ES="$BULLETS"
          fi

          # Google Play enforces strict 500 characters maximum per whatsnew file
          echo "$BULLETS" | head -c 490 > distribution/whatsnew/whatsnew-en-US
          echo "$BULLETS_ES" | head -c 490 > distribution/whatsnew/whatsnew-es-ES

          echo "Release Notes (en-US):"
          cat distribution/whatsnew/whatsnew-en-US
          echo ""
          echo "Release Notes (es-ES):"
          cat distribution/whatsnew/whatsnew-es-ES

      - name: Decode Google Services configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > ${{ github.workspace }}/app/google-services.json

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/keystore/release.keystore

      - name: Build Release Bundle (AAB)
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SPLTRP_ADMOB_APP_ID: ${{ secrets.SPLTRP_ADMOB_APP_ID }}
        run: ./gradlew bundleRelease -x lintVitalRelease

      - name: Verify Bundle Signature & Production Certificate
        run: |
          BUNDLE_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "::error::Release bundle not found at $BUNDLE_PATH"
            exit 1
          fi

          CERT_OUTPUT=$(keytool -printcert -jarfile "$BUNDLE_PATH")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -qi "Android Debug"; then
            echo "::error::Release bundle was signed with debug certificate instead of production upload certificate!"
            exit 1
          fi

          if ! echo "$CERT_OUTPUT" | grep -q "Owner:"; then
            echo "::error::No signing certificate found in $BUNDLE_PATH"
            exit 1
          fi

          OWNER=$(echo "$CERT_OUTPUT" | grep "Owner:" | head -n 1 | sed 's/Owner: //')
          SHA256_FP=$(echo "$CERT_OUTPUT" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          BUNDLE_SIZE=$(du -h "$BUNDLE_PATH" | cut -f1)

          EXPECTED_SHA256="${{ vars.EXPECTED_UPLOAD_KEY_SHA256 }}"
          if [ -n "$EXPECTED_SHA256" ]; then
            if [ "$SHA256_FP" = "$EXPECTED_SHA256" ]; then
              echo "✅ Certificate fingerprint strictly matches configured upload key: $SHA256_FP"
            else
              echo "::error::Certificate SHA-256 ($SHA256_FP) does not match expected upload key ($EXPECTED_SHA256)!"
              exit 1
            fi
          fi

      - name: Verify Deobfuscation Mapping File
        run: |
          MAPPING_PATH="app/build/outputs/mapping/release/mapping.txt"
          if [ ! -f "$MAPPING_PATH" ]; then
            echo "::error::ProGuard/R8 mapping file not found at $MAPPING_PATH"
            exit 1
          fi
          echo "✅ Mapping file found ($(du -h "$MAPPING_PATH" | cut -f1))"

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: es.pedrazamiguez.splittrip
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.track_resolver.outputs.TRACK }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew
          status: completed

      - name: Upload Build Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-${{ steps.version_extractor.outputs.VERSION_NAME }}-build-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            distribution/whatsnew/
          retention-days: 14

      - name: Cleanup Sensitive Keystore
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive keystore..."
          rm -rf ${{ github.workspace }}/keystore

      - name: Publish Step Summary
        if: always()
        run: |
          echo "### 🚀 Google Play Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`${{ steps.version_extractor.outputs.VERSION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Code** | \`${{ steps.version_extractor.outputs.VERSION_CODE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Track** | \`${{ steps.track_resolver.outputs.TRACK }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`app-release.aab\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deobfuscation Mapping** | Uploaded (\`mapping.txt\`) |" >> $GITHUB_STEP_SUMMARY
