name: Build Release Bundle

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release_bundle:
    name: Build & Export Signed Release Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OER_APP_ID_RELEASE: ${{ secrets.OER_APP_ID_RELEASE }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract Version Info
        id: version_extractor
        run: |
          VERSION_MAJOR=$(grep "versionMajor" version.properties | cut -d'=' -f2)
          VERSION_MINOR=$(grep "versionMinor" version.properties | cut -d'=' -f2)
          VERSION_PATCH=$(grep "versionPatch" version.properties | cut -d'=' -f2)
          VERSION_SNAPSHOT=$(grep "versionSnapshot" version.properties | cut -d'=' -f2)

          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          if [ "$VERSION_SNAPSHOT" = "true" ]; then
            VERSION_NAME="${VERSION_NAME}-SNAPSHOT"
          fi

          VERSION_CODE=$((VERSION_MAJOR * 1000000 + VERSION_MINOR * 1000 + VERSION_PATCH))

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "App Version Name: $VERSION_NAME"
          echo "App Version Code: $VERSION_CODE"

      - name: Decode Google Services configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not configured in GitHub Secrets!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > ${{ github.workspace }}/app/google-services.json

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured in GitHub Secrets!"
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/keystore/release.keystore

      - name: Build Release Bundle (AAB)
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SPLTRP_ADMOB_APP_ID: ${{ secrets.SPLTRP_ADMOB_APP_ID }}
        run: ./gradlew bundleRelease -x lintVitalRelease

      - name: Verify Bundle Signature & Production Certificate
        run: |
          BUNDLE_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "::error::Release bundle not found at $BUNDLE_PATH"
            exit 1
          fi

          echo "🔍 Inspecting bundle signing certificate with keytool..."
          CERT_OUTPUT=$(keytool -printcert -jarfile "$BUNDLE_PATH")
          echo "$CERT_OUTPUT"

          # 1. Strictly fail if signed with debug certificate
          if echo "$CERT_OUTPUT" | grep -qi "Android Debug"; then
            echo "::error::Release bundle was signed with debug certificate instead of production upload certificate!"
            exit 1
          fi

          # 2. Verify certificate contains owner info
          if ! echo "$CERT_OUTPUT" | grep -q "Owner:"; then
            echo "::error::No signing certificate found in $BUNDLE_PATH"
            exit 1
          fi

          OWNER=$(echo "$CERT_OUTPUT" | grep "Owner:" | head -n 1 | sed 's/Owner: //')
          SHA256_FP=$(echo "$CERT_OUTPUT" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          BUNDLE_SIZE=$(du -h "$BUNDLE_PATH" | cut -f1)

          # 3. Check against documented production upload key
          EXPECTED_SHA256="01:2A:B7:5D:86:66:1D:95:C0:A2:E5:09:23:66:25:F7:C8:14:2A:EB:6F:CB:DD:CE:B0:46:6E:DC:26:20:86:0E"
          if [ "$SHA256_FP" = "$EXPECTED_SHA256" ]; then
            echo "✅ Certificate fingerprint strictly matches production upload key: $SHA256_FP"
          else
            echo "::warning::Certificate SHA-256 ($SHA256_FP) does not match documented upload key ($EXPECTED_SHA256)."
          fi

          echo "✅ Production upload certificate successfully verified."
          echo "  Owner: $OWNER"
          echo "  SHA-256: $SHA256_FP"
          echo "  Bundle size: $BUNDLE_SIZE"

          # 4. Generate GitHub Actions Step Summary
          echo "### 📦 Release Bundle Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`${{ steps.version_extractor.outputs.VERSION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Code** | \`${{ steps.version_extractor.outputs.VERSION_CODE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle File** | \`app-release.aab\` (\`$BUNDLE_SIZE\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Certificate Owner** | \`$OWNER\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256 Fingerprint** | \`$SHA256_FP\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Release Bundle & Mapping Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: split-trip-release-bundle-${{ steps.version_extractor.outputs.VERSION_NAME }}-build-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive keystore..."
          rm -rf ${{ github.workspace }}/keystore
